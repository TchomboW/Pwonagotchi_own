name: Python CI

on:
  push:
    branches: [ main ]
    paths:
      - '**.py'
      - 'requirements.txt'
      - '.github/workflows/python-ci.yml'
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 autoflake

      - name: Check Python syntax (all files)
        run: |
          echo "Checking Python syntax..."
          find . -name '*.py' -not -path './venv/*' -not -path './.git/*' | while read f; do
            python -m py_compile "$f" || { echo "SYNTAX ERROR in $f"; exit 1; }
          done
          echo "✅ All Python files compile successfully"

      - name: Flake8 lint
        run: |
          flake8 . --count --select=E9,F63,F7,F82,
            --show-source --statistics \
            --exclude=.git,venv,__pycache__,rust_engine

      - name: Verify imports for core modules
        run: |
          python -c "
          import sys
          sys.path.insert(0, '.')
          from core.event_bus import EventBus
          from core.orchestration.engine_orchestrator import EngineOrchestrator
          from core.hardware.controller import HardwareController
          from core.hardware.display_controller import DisplayController
          from intelligence.agent import IntelligenceAgent
          from intelligence.cycles.base_cycle import BaseIntelligenceCycle
          from intelligence.memory.state_manager import StateManager
          from intelligence.profiles.base_profile import BaseProfile
          from intelligence.profiles.stealth import StealthProfile
          print('✅ All core imports successful')
          "
